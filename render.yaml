# Despliegue en Render (https://render.com) — plan gratuito.
# Render lee este archivo al crear un "Blueprint" desde el repo de GitHub
# y vuelve a desplegar solo en cada push a main.
services:
  - type: web
    name: supplement-backend
    runtime: node
    plan: free
    region: frankfurt # cerca de España y de la BD de Supabase (París)
    branch: main
    # --include=dev: el build necesita el CLI de Nest (devDependencies)
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Los días (rachas, puntos diarios, semanas) se cuentan en hora de España.
      # Sin esto Render usa UTC y una toma a las 00:30 contaría como del día anterior.
      - key: TZ
        value: Europe/Madrid
      # Plan Pro APAGADO: versión gratuita. Sus rutas responden 404 y la tienda no muestra objetos Pro.
      - key: PRO_ENABLED
        value: "false"
      # Se pega a mano en el panel de Render (la misma URL de Supabase del .env)
      - key: DATABASE_URL
        sync: false
      # Render genera una clave nueva y segura
      - key: JWT_SECRET
        generateValue: true
      # Emails (recuperar contraseña) con Brevo. Sin ellas el código solo sale en los logs.
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM # email remitente verificado en Brevo
        sync: false
